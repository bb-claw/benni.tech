# benni.tech — security response headers
#
# Include this file inside your server{} block for benni.tech.
#
# IMPORTANT — nginx add_header inheritance:
# `add_header` directives in an inner block (e.g. a `location{}`) hide ALL
# `add_header` directives from outer blocks. If a location{} sets its own
# headers (nginx-theme.conf does this for Set-Cookie), either:
#   a) also include this file inside that location{}, or
#   b) move the per-location headers out, so the server{}-level ones apply.
# The `always` flag ensures headers are also sent on error responses.

# Content Security Policy
# Static site, same-origin only, no JavaScript, no external resources.
# style-src 'self'  — the three stylesheets
# img-src 'self'    — allow future in-article images from the same origin
# base-uri 'self'   — prevent <base> injection
# form-action 'none' — no forms on this site
# frame-ancestors 'none' — site cannot be framed anywhere
add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

# HSTS — enforce HTTPS for 2 years, include subdomains, request preload.
# Only enable `preload` once you have confirmed every subdomain is HTTPS-only.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Block MIME-type sniffing by browsers.
add_header X-Content-Type-Options "nosniff" always;

# Do not leak referrer to third parties.
add_header Referrer-Policy "no-referrer" always;

# Disable browser features this site does not use.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Belt-and-suspenders for older browsers; CSP frame-ancestors already covers this.
add_header X-Frame-Options "DENY" always;
