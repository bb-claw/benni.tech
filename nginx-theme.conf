# benni.tech — JS-free theme switching via query param + cookie + sub_filter
# Requires: ngx_http_sub_module (included in most nginx builds)
#
# HOW IT WORKS:
#   ?style=brutal  → sets cookie, serves brutal stylesheet on same request
#   ?style=mono    → clears cookie, reverts to default
#   (no param)     → reads cookie to decide stylesheet
#
# USAGE: paste the map{} block into your http{} context,
#        paste the rest into your server{} block for benni.tech.

# ── http{} context ────────────────────────────────────────────────────────────
map "$arg_style:$cookie_style" $theme_css {
    ~^brutal    /style-brutal.css;   # ?style=brutal wins regardless of cookie
    ~^:brutal$  /style-brutal.css;   # no param, cookie=brutal
    default     /style.css;
}

# ── server{} context ──────────────────────────────────────────────────────────
sub_filter_once off;
sub_filter_types text/html;
sub_filter '/style.css' '$theme_css';

location / {
    if ($arg_style = "brutal") {
        add_header Set-Cookie "style=brutal; Path=/; SameSite=Lax" always;
    }
    if ($arg_style = "mono") {
        add_header Set-Cookie "style=mono; Path=/; SameSite=Lax" always;
    }
    try_files $uri $uri/ =404;
}
